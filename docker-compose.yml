services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scoring_app
      POSTGRES_PASSWORD: scoring_app
      POSTGRES_DB: scoring_app
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoring_app -d scoring_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:

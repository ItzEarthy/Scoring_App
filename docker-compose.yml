services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scoring_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scoring_app}
      POSTGRES_DB: ${POSTGRES_DB:-scoring_app}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scoring_app} -d ${POSTGRES_DB:-scoring_app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: builder
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-scoring_app}:${POSTGRES_PASSWORD:-scoring_app}@db:5432/${POSTGRES_DB:-scoring_app}?schema=public
    depends_on:
      db:
        condition: service_healthy

  realtime:
    build:
      context: .
      dockerfile: realtime/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      REALTIME_SHARED_SECRET: ${REALTIME_SHARED_SECRET:?REALTIME_SHARED_SECRET must be set in .env}

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3001}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:?NEXT_PUBLIC_VAPID_PUBLIC_KEY must be set in .env}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-scoring_app}:${POSTGRES_PASSWORD:-scoring_app}@db:5432/${POSTGRES_DB:-scoring_app}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set in .env}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      REALTIME_INTERNAL_URL: http://realtime:3001
      REALTIME_SHARED_SECRET: ${REALTIME_SHARED_SECRET:?REALTIME_SHARED_SECRET must be set in .env}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?VAPID_PRIVATE_KEY must be set in .env}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
    depends_on:
      migrate:
        condition: service_completed_successfully
      realtime:
        condition: service_started

volumes:
  db_data:
